<style>

body{
margin:0;
overflow:hidden;
background:#000;
font-family:monospace;

}

/* ===== GLITCH OVERLAY ===== */
body::before{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:repeating-linear-gradient(
0deg,
rgba(0,255,204,0.05),
rgba(0,255,204,0.05) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
z-index:2;
}

/* ===== NOISE ===== */
body::after{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:url('https://i.imgur.com/3ZQ3ZQp.png');
opacity:0.05;
pointer-events:none;
z-index:3;
}

#bg{
position:fixed;
top:0;
left:0;
z-index:0;
}

.ui{
position:absolute;
z-index:10;
width:900px;
height:600px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.85);
border:1px solid #00ffcc;
box-shadow:0 0 40px #00ffcc;
display:flex;
opacity:0;
backdrop-filter: blur(8px);
animation: flicker 3s infinite;
}

@keyframes flicker{
0%,100%{box-shadow:0 0 20px #00ffcc;}
50%{box-shadow:0 0 60px #00ffcc;}
}

.left{
width:35%;
border-right:1px solid #00ffcc;
padding:10px;
font-size:11px;
overflow:hidden;
}

.right{
width:65%;
padding:40px;
}

.glitch{
font-size:22px;
text-shadow:
0 0 5px #00ffcc,
0 0 10px #00ffcc,
0 0 20px #00ffcc;
animation: glitch 1s infinite;
}

@keyframes glitch{
0%{transform:translate(0);}
20%{transform:translate(-1px,1px);}
40%{transform:translate(1px,-1px);}
60%{transform:translate(-1px,-1px);}
80%{transform:translate(1px,1px);}
100%{transform:translate(0);}
}

input{
width:100%;
padding:12px;
margin:10px 0;
background:black;
border:1px solid #00ffcc;
color:#00ffcc;
outline:none;
box-shadow:0 0 10px #00ffcc33;
}

button{
width:100%;
padding:12px;
background:#00ffcc;
border:none;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
background:white;
box-shadow:0 0 30px #00ffcc;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:4px;
background:#111;
z-index:20;
}

#bar{
width:0%;
height:100%;
background:#00ffcc;
box-shadow:0 0 20px #00ffcc;
}

#success{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#00ffcc;
color:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99;
}

.type{
white-space:nowrap;
overflow:hidden;
border-right:2px solid #00ffcc;
animation: typing 3s steps(30,end), blink .6s infinite;
}

@keyframes typing{
from{width:0}
to{width:100%}
}

@keyframes blink{
50%{border-color:transparent}
}

</style>
</head>

<body>

</html>
